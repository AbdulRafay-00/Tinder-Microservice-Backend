name: tinder-api-gateway

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinder-api-gateway
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://tinder-service-registry:8761/eureka/
    networks:
      - tinder-network

networks:
  tinder-network:
    external: true