services:
  mysql:
    image: mysql:8.0.43
    container_name: tinder-pairing-service-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tinder_pairing_service
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3304:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tinder-network

  pairing-service:
    build: 
        context: .
        dockerfile: dockerfile
    container_name: tinder-pairing-service
    restart: unless-stopped
    ports:
      - "8092:8092"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tinder_user_service
      SPRING_DATASOURCE_URL: jdbc:mysql://tinder-pairing-service-mysql:3306/tinder_pairing_service
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SECRET_KEY: ${JWT_SECRET_KEY}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: Tinder-kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://tinder-service-registry:8761/eureka/
    networks:
      - tinder-network

volumes:
  mysql_data:

networks:
  tinder-network:
    external: true