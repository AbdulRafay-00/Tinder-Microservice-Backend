
name: Java CI with Maven

on:
  push:
    branches: [ "feature-cicd-error-fix-suite" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    # runs-on: ubuntu-latest
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean package -DskipTests
      working-directory: ./user-service
    # - name: Build microservices with Maven
    #   shell: bash
    #   run: |
    #     for service in API-Gateway locationService match-service Notification-Service Orchestration-Service Pairing-Service Service-Registry user-service; do
    #       mvn -B package --file "$service/pom.xml"
    #     done

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6