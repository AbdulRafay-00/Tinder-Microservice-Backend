name: tinder-orchestration-service

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinder-orchestration-service
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://tinder-service-registry:8761/eureka/
    networks:
      - tinder-network

networks:
  tinder-network:
    external: true