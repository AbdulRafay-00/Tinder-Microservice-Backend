name: tinder-orchestration-service

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinder-orchestration-service
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://tinder-service-registry:8761/eureka/
      SPRING_DATA_REDIS_HOST: Tinder-Redis-Orchestration
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - tinder-network

      
  redis:
    image: redis:latest
    container_name: Tinder-Redis-Orchestration
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - tinder-network


networks:
  tinder-network:
    external: true